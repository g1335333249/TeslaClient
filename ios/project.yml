name: VoltMate
options:
  bundleIdPrefix: cn.voltmate
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VoltMate:
    type: application
    platform: iOS
    sources: [VoltMate]
    info:
      path: VoltMate/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [voltmate]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.voltmate.VoltMate
        INFOPLIST_KEY_CFBundleDisplayName: VoltMate
        CODE_SIGNING_ALLOWED: NO
  VoltMateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VoltMateTests]
    dependencies:
      - target: VoltMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.voltmate.VoltMateTests
        CODE_SIGNING_ALLOWED: NO
